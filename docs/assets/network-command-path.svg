<text x="720.0" y="1269.5" text-anchor="middle">Dequeue; check four-character</text>
<text x="720.0" y="1290.5" text-anchor="middle">prefix</text>
<rect x="570" y="1370" width="300" height="88" rx="12" fill="#172c42" stroke="#38bdf8"/>
