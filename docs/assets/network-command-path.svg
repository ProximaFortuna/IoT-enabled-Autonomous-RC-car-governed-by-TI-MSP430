<text x="190.0" y="160.0" text-anchor="middle">Timer-driven ESP32-WROOM reset</text>
<rect x="40" y="250" width="300" height="88" rx="12" fill="#172c42" stroke="#38bdf8"/>
<text x="190.0" y="289.5" text-anchor="middle">Foreground Startup_Commands</text>
<text x="190.0" y="310.5" text-anchor="middle">service</text>
<rect x="40" y="390" width="300" height="88" rx="12" fill="#172c42" stroke="#38bdf8"/>
<text x="190.0" y="440.0" text-anchor="middle">AT+SYSSTORE=0: persistence off</text>
<rect x="40" y="530" width="300" height="88" rx="12" fill="#172c42" stroke="#38bdf8"/>
<text x="190.0" y="569.5" text-anchor="middle">AT+CIPMUX=1: multiple</text>
<text x="190.0" y="590.5" text-anchor="middle">connections</text>
<rect x="40" y="670" width="300" height="88" rx="12" fill="#172c42" stroke="#38bdf8"/>
