<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
<title id="title">RC car execution flow</title><desc id="desc">Initialization, foreground services, network startup, command parsing, calibration and line following, with interrupt inputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1660" rx="20" fill="#0b1220"/>
<style>text{font-family:Arial,sans-serif;fill:#e2e8f0;font-size:18px} .heading{font-size:30px;font-weight:bold} .small{font-size:15px;fill:#a5b4c8} .label{font-size:16px;fill:#67e8f9} .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="50" y="55" class="heading">Autonomous RC Car</text><text x="50" y="86" class="small">MSP430FR2355 · Foreground execution and interrupt-driven inputs</text>
<rect x="70" y="120" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="159.0" text-anchor="middle">Reset / main</text>
<rect x="70" y="220" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="259.0" text-anchor="middle">Request wheels off; enable outputs</text>
<rect x="70" y="320" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="359.0" text-anchor="middle">Initialize ports, clocks, conditions, timers</text>
<rect x="70" y="420" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="459.0" text-anchor="middle">Initialize ADC, DAC, LCD and serial</text>
<rect x="70" y="520" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="559.0" text-anchor="middle">Display calibration prompt</text>
<rect x="70" y="620" width="560" height="66" rx="12" fill="#123345" stroke="#22d3ee"/>
<text x="350.0" y="659.0" text-anchor="middle">Foreground loop: service display</text>
<rect x="70" y="720" width="560" height="66" rx="12" fill="#123345" stroke="#22d3ee"/>
<text x="350.0" y="759.0" text-anchor="middle">Service scheduled network startup</text>
<rect x="70" y="820" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="859.0" text-anchor="middle">AT probe and UART buffer service</text>
<rect x="70" y="920" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="959.0" text-anchor="middle">Assemble lines; extract commands; enqueue</text>
<rect x="70" y="1020" width="560" height="66" rx="12" fill="#123345" stroke="#22d3ee"/>
<text x="350.0" y="1047.0" text-anchor="middle">Command parser: stop shortcut, prefix,</text>
<text x="350.0" y="1071.0" text-anchor="middle">duration and opcode dispatch</text>
<rect x="70" y="1120" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="1159.0" text-anchor="middle">Check conflicting motor directions</text>
<rect x="70" y="1220" width="560" height="66" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="350.0" y="1259.0" text-anchor="middle">Calibration active?</text>
<path d="M350 186 V220" class="edge"/>
<path d="M350 286 V320" class="edge"/>
<path d="M350 386 V420" class="edge"/>
<path d="M350 486 V520" class="edge"/>
<path d="M350 586 V620" class="edge"/>
<path d="M350 686 V720" class="edge"/>
<path d="M350 786 V820" class="edge"/>
<path d="M350 886 V920" class="edge"/>
<path d="M350 986 V1020" class="edge"/>
<path d="M350 1086 V1120" class="edge"/>
<path d="M350 1186 V1220" class="edge"/>
<rect x="740" y="200" width="390" height="260" rx="12" fill="#123345" stroke="#22d3ee"/>
<text x="935.0" y="264.0" text-anchor="middle">ESP32-WROOM / UART</text>
<text x="935.0" y="288.0" text-anchor="middle">Timer-driven IoT reset</text>
<text x="935.0" y="312.0" text-anchor="middle">AT+SYSSTORE=0</text>
<text x="935.0" y="336.0" text-anchor="middle">AT+CIPMUX=1</text>
<text x="935.0" y="360.0" text-anchor="middle">AT+CIPSERVER=1,5324</text>
<text x="935.0" y="384.0" text-anchor="middle">AT+CWJAP? and AT+CIFSR</text>
<text x="935.0" y="408.0" text-anchor="middle">Display SSID / IP</text>
<rect x="740" y="490" width="390" height="92" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="935.0" y="518.0" text-anchor="middle">Wi-Fi association is external.</text>
<text x="935.0" y="542.0" text-anchor="middle">TCP client needs a route to</text>
<text x="935.0" y="566.0" text-anchor="middle">the module IP and port 5324.</text>
<path d="M630 753 H680 V330 H740" class="edge" stroke-dasharray="6 6"/>
<text x="690" y="690" class="label">scheduled steps</text>
<rect x="740" y="720" width="390" height="80" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="935.0" y="754.0" text-anchor="middle">UART interrupts</text>
<text x="935.0" y="778.0" text-anchor="middle">Receive / transmit buffered bytes</text>
<path d="M740 760 H705 V853 H630" class="edge" stroke-dasharray="6 6"/>
<rect x="740" y="850" width="390" height="80" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="935.0" y="884.0" text-anchor="middle">Timer interrupts</text>
<text x="935.0" y="908.0" text-anchor="middle">Counters and service timing</text>
<path d="M1130 890 H1160 V653 H630" class="edge" stroke-dasharray="6 6"/>
<rect x="740" y="980" width="390" height="80" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="935.0" y="1014.0" text-anchor="middle">ADC interrupts</text>
<text x="935.0" y="1038.0" text-anchor="middle">Left / right detector readings</text>
<rect x="740" y="1110" width="390" height="80" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="935.0" y="1144.0" text-anchor="middle">Switch interrupts</text>
<text x="935.0" y="1168.0" text-anchor="middle">Calibration mode and captures</text>
<path d="M740 1150 H690 V1253 H630" class="edge" stroke-dasharray="6 6"/>
<rect x="50" y="1330" width="280" height="76" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="190.0" y="1374.0" text-anchor="middle">Show calibration menu</text>
<rect x="390" y="1330" width="300" height="76" rx="12" fill="#172336" stroke="#3b506c"/>
<text x="540.0" y="1362.0" text-anchor="middle">Restore LCD mode;</text>
<text x="540.0" y="1386.0" text-anchor="middle">disable TB1 CCR1 interrupt</text>
<path d="M240 1286 V1310 H190 V1330" class="edge"/>
<text x="200" y="1308" class="label">Yes</text>
<path d="M460 1286 V1310 H540 V1330" class="edge"/>
<text x="550" y="1308" class="label">No</text>
<rect x="210" y="1450" width="400" height="66" rx="12" fill="#123345" stroke="#22d3ee"/>
<text x="410.0" y="1489.0" text-anchor="middle">Line-following enabled?</text>
<path d="M190 1406 V1430 H350 V1450" class="edge"/>
<path d="M540 1406 V1430 H470 V1450" class="edge"/>
<rect x="740" y="1440" width="390" height="86" rx="12" fill="#123345" stroke="#22d3ee"/>
<text x="935.0" y="1477.0" text-anchor="middle">Advance Black_Line state machine</text>
<text x="935.0" y="1501.0" text-anchor="middle">Sensor feedback → motor PWM</text>
<path d="M610 1483 H740" class="edge"/>
<text x="660" y="1470" class="label">Yes</text>
<path d="M935 1060 V1440" class="edge" stroke-dasharray="6 6"/>
<path d="M210 1483 H25 V653 H70" class="edge"/>
<text x="35" y="1430" class="label">No: next loop</text>
<path d="M935 1526 V1580 H15 V653 H70" class="edge"/>
<text x="55" y="1630" class="small">Solid arrows: execution flow · Dashed arrows: service details / interrupt inputs</text></svg>